<!DOCTYPE html>
<html lang="en">
<head>
  <title>Home Assistant</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,user-scalable=no">
  <link href="assets/style.css" rel="stylesheet">
  <link href="assets/error.css" rel="stylesheet">
</head>
<body>
<div class="vertical-center"><div class="content">
  <div class="center">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130.2 130.2">
      <circle class="path circle" fill="none" stroke="#D06079" stroke-width="6" cx="65.1" cy="65.1" r="62.1"/>
      <line class="path line" fill="none" stroke="#D06079" stroke-width="6" stroke-linecap="round" x1="34.4" y1="37.9" x2="95.8" y2="92.3"/>
      <line class="path line" fill="none" stroke="#D06079" stroke-width="6" stroke-linecap="round" x1="95.8" y1="38" x2="34.4" y2="92.2"/>
    </svg>
  </div>
  <div class="center"><p class="error">Home Assistant is unavailable. Check the connection and try again.</p></div>
  <div class="center">
    <button class="pure-material-button-contained" id="reconnect">Reconnect</button>
    <button class="pure-material-button-contained" id="restart" style="margin-left: 10px">Restart</button>
  </div>
</div></div>
<script>
  const invoke = window.__TAURI__.core.invoke;
  document.getElementById('reconnect').addEventListener('click', () => invoke('reconnect'));
  document.getElementById('restart').addEventListener('click', () => invoke('restart_app'));
</script>
</body>
</html>
