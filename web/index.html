<!DOCTYPE html>
<html lang="en">
<head>
  <title>Home Assistant</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,user-scalable=no">
  <link href="assets/style.css" rel="stylesheet">
  <link href="assets/checkmark.css" rel="stylesheet">
</head>
<body>
<div class="container">
  <div class="content">
    <div class="center header"><img src="assets/favicon.png" height="52" alt=""> Home Assistant</div>
    <div id="availableInstancesContainer" hidden>
      <div class="center"><p>Available instances</p></div>
      <div class="center"><div id="availableInstances"></div></div>
    </div>
    <div class="center" style="margin-top: 30px"></div>
    <div class="center">
      <div id="check-wrapper" class="success-checkmark">
        <div class="check-icon center">
          <span class="icon-line line-tip"></span><span class="icon-line line-long"></span>
          <div class="icon-circle"></div><div class="icon-fix"></div>
        </div>
        <p><small class="grey">URL checked. Opening Home Assistant…</small></p>
      </div>
      <div id="url-wrapper" class="group">
        <input type="url" required id="url" placeholder="e.g. http://homeassistant.local:8123" autocomplete="url">
        <span class="highlight"></span><span class="bar"></span>
        <label for="url">Home Assistant URL</label>
        <div id="error" class="invalid-feedback">Please provide a valid URL.</div>
        <button class="pure-material-button-contained" id="submit" disabled>Connect</button>
      </div>
      <p id="runtime" class="grey"><small>Checking system WebView…</small></p>
    </div>
  </div>
</div>
<script>
  const invoke = window.__TAURI__.core.invoke;
  const field = document.getElementById('url');
  const submit = document.getElementById('submit');
  let checkTimer;

  function normalize(value) {
    try {
      const url = new URL(value.trim());
      if (!['http:', 'https:'].includes(url.protocol) || url.username || url.password) return null;
      return url.href;
    } catch (_) { return null; }
  }

  function setError(message = '') {
    document.getElementById('error').textContent = message || 'Please provide a valid URL.';
    field.classList.toggle('is-invalid', Boolean(message));
  }

  async function checkUrl() {
    clearTimeout(checkTimer);
    submit.disabled = true;
    field.classList.remove('is-invalid', 'is-valid');
    const address = normalize(field.value);
    if (!address) { if (field.value) setError('Use a valid http:// or https:// address.'); return; }
    checkTimer = setTimeout(async () => {
      try {
        await invoke('verify_instance', { address });
        field.classList.add('is-valid');
        submit.disabled = false;
        setError();
      } catch (error) { setError(String(error)); }
    }, 250);
  }

  function showInstance(address) {
    const container = document.getElementById('availableInstancesContainer');
    container.hidden = false;
    const button = document.createElement('button');
    button.className = 'pure-material-button-contained';
    button.textContent = address;
    button.addEventListener('click', () => { field.value = address; checkUrl(); });
    document.getElementById('availableInstances').append(button);
  }

  async function initialize() {
    field.focus();
    try {
      const state = await invoke('get_client_state');
      const version = state.webviewVersion ? ` ${state.webviewVersion}` : '';
      document.getElementById('runtime').innerHTML = `<small>${state.webviewName}${version}<br>${state.webviewRuntimePolicy}</small>`;
      const known = new Set(state.instances || []);
      state.instances.forEach(showInstance);
      invoke('discover_instances').then(items => items.filter(item => !known.has(item)).forEach(showInstance)).catch(() => {});
    } catch (error) { setError(String(error)); }
  }

  field.addEventListener('input', checkUrl);
  submit.addEventListener('click', async () => {
    const address = normalize(field.value);
    if (!address) return;
    submit.disabled = true;
    document.getElementById('check-wrapper').style.display = 'block';
    document.getElementById('url-wrapper').style.display = 'none';
    try { await invoke('add_instance', { address }); }
    catch (error) {
      document.getElementById('check-wrapper').style.display = 'none';
      document.getElementById('url-wrapper').style.display = 'block';
      setError(String(error));
    }
  });
  document.addEventListener('DOMContentLoaded', initialize);
</script>
</body>
</html>
